apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        fsGroup: 1000
        supplementalGroups:
          - 44
          - 110
      initContainers:
      - name: abyss-branding
        image: alpine:3.20.3
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            F=/config/config/branding.xml
            URL='https://cdn.jsdelivr.net/gh/AumGupta/abyss-jellyfin@main/abyss.css'
            CSS="@import url('${URL}');"
            mkdir -p /config/config
            if [ ! -f "$F" ]; then
              {
                echo '<?xml version="1.0" encoding="utf-8"?>'
                echo '<BrandingOptions>'
                echo '  <LoginDisclaimer />'
                echo "  <CustomCss>${CSS}</CustomCss>"
                echo '  <SplashscreenEnabled>true</SplashscreenEnabled>'
                echo '</BrandingOptions>'
              } > "$F"
              echo "abyss-branding: created $F"
            elif grep -q "abyss-jellyfin" "$F"; then
              echo "abyss-branding: abyss CSS already set, skipping"
            else
              sed -i \
                -e "s|<CustomCss />|<CustomCss>${CSS}</CustomCss>|" \
                -e "s|<CustomCss></CustomCss>|<CustomCss>${CSS}</CustomCss>|" \
                "$F"
              echo "abyss-branding: patched CustomCss in $F"
            fi
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: config-volume
            mountPath: /config
      - name: abyss-web-seed
        image: lscr.io/linuxserver/jellyfin:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            cp -a /usr/share/jellyfin/web/. /work/
            echo "abyss-web-seed: copied $(find /work -maxdepth 1 | wc -l) entries"
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: jellyfin-web
            mountPath: /work
      - name: abyss-spotlight
        image: alpine:3.20.3
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            RAW='https://raw.githubusercontent.com/AumGupta/abyss-jellyfin/main'
            BASE="${RAW}/scripts/spotlight"
            STAGE=/tmp/abyss
            WEB=/web
            mkdir -p "$STAGE" "$WEB/ui"
            for f in spotlight.html spotlight.css home-html.chunk.js; do
              wget -q -O "$STAGE/$f" "$BASE/$f"
              if [ ! -s "$STAGE/$f" ]; then
                echo "abyss-spotlight: empty download $f"
                exit 1
              fi
            done
            cp -f "$STAGE/spotlight.html" "$WEB/ui/spotlight.html"
            cp -f "$STAGE/spotlight.css"  "$WEB/ui/spotlight.css"
            CHUNK=$(find "$WEB" -maxdepth 1 -name 'home-html.*.chunk.js' | head -n1)
            if [ -z "$CHUNK" ]; then
              echo "abyss-spotlight: no home-html.*.chunk.js, skipping patch"
              exit 0
            fi
            if grep -qE 'abyss-spotlight-frame|featurediframe' "$CHUNK"; then
              echo "abyss-spotlight: $(basename "$CHUNK") already patched"
              exit 0
            fi
            cp -f "$CHUNK" "${CHUNK}.bak"
            cp -f "$STAGE/home-html.chunk.js" "$CHUNK"
            echo "abyss-spotlight: patched $(basename "$CHUNK")"
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: jellyfin-web
            mountPath: /web
      containers:
      - name: jellyfin
        image: lscr.io/linuxserver/jellyfin:latest
        env:
        - name: TZ
          value: "Australia/Melbourne"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        ports:
        - containerPort: 8096
          name: http
        volumeMounts:
        - name: config-volume
          mountPath: /config
        - name: cache-volume
          mountPath: /cache
        - name: media-volume
          mountPath: /media
        - name: movies-volume
          mountPath: /movies
        - name: tv-volume
          mountPath: /tv
        - name: dri
          mountPath: /dev/dri
        - name: jellyfin-web
          mountPath: /usr/share/jellyfin/web
      volumes:
      - name: config-volume
        persistentVolumeClaim:
          claimName: jellyfin-config-pvc
      - name: jellyfin-web
        emptyDir: {}
      - name: cache-volume
        hostPath:
          path: /home/obiwan/k8s_data/jellyfin/cache
          type: DirectoryOrCreate
      - name: media-volume
        hostPath:
          path: /home/obiwan/media_server/media
          type: DirectoryOrCreate
      - name: movies-volume
        hostPath:
          path: /home/obiwan/movies
          type: Directory
      - name: tv-volume
        hostPath:
          path: /home/obiwan/tv
          type: Directory
      - name: dri
        hostPath:
          path: /dev/dri
