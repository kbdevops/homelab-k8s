apiVersion: v1
kind: Service
metadata:
  name: worthly
  namespace: worthly
spec:
  selector:
    app: worthly
  ports:
    - port: 5050
      targetPort: 5050
  # ClusterIP: all access goes through Traefik, either Host(`worthly.internal`) on the
  # LAN or PathPrefix(`/worthly`) on port 80. The NodePort that briefly lived here was
  # only a local target for Tailscale Funnel, which is no longer used — leaving it would
  # keep a LAN-reachable port open that bypasses the ingress for no benefit.
  type: ClusterIP
