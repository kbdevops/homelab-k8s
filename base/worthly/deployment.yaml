apiVersion: apps/v1
kind: Deployment
metadata:
  name: worthly
  namespace: worthly
  labels:
    app: worthly
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worthly
  template:
    metadata:
      labels:
        app: worthly
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: worthly
          image: ghcr.io/kbdevops/worthly:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5050
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATA_DIR
              value: "/app/data"
            - name: TZ
              value: "Australia/Melbourne"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: worthly-jwt
                  key: JWT_SECRET_KEY
            # Behind Tailscale Funnel -> Traefik, every request reaches the app from the
            # proxy, so without this the per-IP login throttle sees one client and 10 bad
            # attempts from anyone would lock out everyone (including you) for 15 minutes.
            - name: TRUST_PROXY
              value: "1"
            # Reachable from the internet: send HSTS, and keep registration closed.
            - name: PUBLIC_MODE
              value: "1"
            - name: ALLOW_REGISTRATION
              value: "0"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          hostPath:
            path: /home/obiwan/k8s_data/worthly
            type: DirectoryOrCreate
