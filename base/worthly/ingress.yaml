# Redirect the public hostname from HTTP to HTTPS. Scoped to that Host only — a
# catch-all redirect on the `web` entrypoint would also hijack Jellyfin, which answers
# host-less requests on port 80.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: worthly
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: worthly
  namespace: worthly
spec:
  entryPoints:
    - web
  routes:
    # There is deliberately NO PathPrefix(`/worthly`) route here. It existed as a
    # cleartext fallback on the shared port 80 before TLS was set up, and it let anyone
    # reach the login form over plain HTTP on the bare IP — which defeats the certificate
    # on the public hostname. Public access is HTTPS-only; the LAN keeps plain HTTP.

    # LAN hostname over plain HTTP, unchanged.
    - match: Host(`worthly.internal`)
      kind: Rule
      services:
        - name: worthly
          port: 5050

    # Public hostname on HTTP -> bounce to HTTPS, EXCEPT the ACME challenge path.
    #
    # Without the exclusion this redirect swallows Let's Encrypt's HTTP-01 challenge and
    # sends it to :443 — which cannot be open yet, because opening it needs the very
    # certificate the challenge is trying to issue. cert-manager reported exactly that:
    #   dial tcp <ip>:443: connect: no route to host
    # It would also break every 60-day renewal, not just the first issuance.
    - match: Host(`worthly.duckdns.org`) && !PathPrefix(`/.well-known/acme-challenge/`)
      kind: Rule
      priority: 1000
      middlewares:
        - name: redirect-https
      services:
        - name: worthly
          port: 5050

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: worthly-tls
  namespace: worthly
spec:
  entryPoints:
    - websecure
  routes:
    # Served at the ROOT of the public hostname. The bundle is built with base=/worthly/,
    # but that is fine here: the browser requests /worthly/assets/... against this same
    # host, the route matches any path, and the app strips the prefix.
    - match: Host(`worthly.duckdns.org`)
      kind: Rule
      services:
        - name: worthly
          port: 5050
  tls:
    secretName: worthly-tls
