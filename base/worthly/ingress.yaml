# Redirect the public hostname from HTTP to HTTPS. Scoped to that Host only — a
# catch-all redirect on the `web` entrypoint would also hijack Jellyfin, which answers
# host-less requests on port 80.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: worthly
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: worthly
  namespace: worthly
spec:
  entryPoints:
    - web
  routes:
    # LAN hostname over plain HTTP, unchanged.
    - match: Host(`worthly.internal`)
      kind: Rule
      services:
        - name: worthly
          port: 5050

    # Public hostname on HTTP -> bounce to HTTPS.
    - match: Host(`mrmongoose.duckdns.org`)
      kind: Rule
      priority: 1000
      middlewares:
        - name: redirect-https
      services:
        - name: worthly
          port: 5050

    # Path route kept so http://<ip>/worthly still works if DNS or the cert is ever down.
    # The app strips the prefix itself, so no stripPrefix middleware is needed.
    - match: PathPrefix(`/worthly`)
      kind: Rule
      priority: 900
      services:
        - name: worthly
          port: 5050
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: worthly-tls
  namespace: worthly
spec:
  entryPoints:
    - websecure
  routes:
    # Served at the ROOT of the public hostname. The bundle is built with base=/worthly/,
    # but that is fine here: the browser requests /worthly/assets/... against this same
    # host, the route matches any path, and the app strips the prefix.
    - match: Host(`mrmongoose.duckdns.org`)
      kind: Rule
      services:
        - name: worthly
          port: 5050
  tls:
    secretName: worthly-tls
