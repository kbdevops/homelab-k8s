apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
spec:
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        ports:
        - containerPort: 8989
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
        - name: tv
          mountPath: /tv          
      volumes:
      - name: config
        hostPath:
          path: /home/obiwan/k8s_data/sonarr/config
      - name: downloads
        hostPath:
          path: /home/obiwan/media/downloads
      - name: tv
        hostPath:
          path: /home/obiwan/media/tv   
