apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:latest
        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "192.168.1.108:30000,localhost,127.0.0.1,homepage.internal"
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: icons
          mountPath: /app/public/icons
      volumes:
      - name: config
        hostPath:
          path: /home/obiwan/k8s_data/homepage/config/
      - name: icons
        hostPath:
          path: /home/obiwan/k8s_data/homepage/config/icons/
