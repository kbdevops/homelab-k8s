apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
spec:
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
      - name: radarr
        image: lscr.io/linuxserver/radarr:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        ports:
        - containerPort: 7878
        volumeMounts:
        - name: config
          mountPath: /config
        # YOU WERE MISSING THESE MOUNTS:
        - name: downloads
          mountPath: /downloads
        - name: movies
          mountPath: /movies
      volumes:
      - name: config
        hostPath:
          path: /home/obiwan/k8s_data/radarr/config
      - name: downloads
        hostPath:
          path: /home/obiwan/media/downloads
      - name: movies
        hostPath:
          path: /home/obiwan/media/movies