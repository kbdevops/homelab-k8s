---
apiVersion: v1
kind: Service
metadata:
  name: adguardhome-dns
  namespace: adguard
spec:
  type: LoadBalancer
  selector:
    app: adguardhome
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
