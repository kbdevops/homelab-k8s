---
apiVersion: v1
kind: Service
metadata:
  name: adguardhome-dns
  namespace: adguard
spec:
  type: LoadBalancer
  selector:
    app: adguardhome
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: adguardhome-web
  namespace: adguard
spec:
  type: ClusterIP
  selector:
    app: adguardhome
  ports:
    - name: web
      port: 80
      targetPort: 80
