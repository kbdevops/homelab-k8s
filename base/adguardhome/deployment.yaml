apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome
  namespace: adguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguardhome
  template:
    metadata:
      labels:
        app: adguardhome
    spec:
      initContainers:
        - name: config-fixer
          image: busybox
          command:
            - sh
            - -c
            - |
              CONFIG="/opt/adguardhome/conf/AdGuardHome.yaml"
              [ ! -f "$CONFIG" ] && exit 0
              
              # Ensure rewrites section exists and isn't empty brackets
              sed -i 's/rewrites: \[\]/rewrites:/' "$CONFIG"
              
              add_rewrite() {
                DOMAIN=$1
                IP="192.168.1.108"
                if ! grep -q "$DOMAIN" "$CONFIG"; then
                  echo "Adding $DOMAIN..."
                  # Ensure we append to the rewrites list correctly
                  # This is a simple append; AdGuard will handle the YAML structure on next save
                  printf "  - domain: $DOMAIN\n    answer: $IP\n    enabled: true\n" >> "$CONFIG"
                fi
              }

              add_rewrite "kargo.internal"
              add_rewrite "jellyfin.internal"
              add_rewrite "prowlarr.internal"
              add_rewrite "sonarr.internal"
              add_rewrite "radarr.internal"
              add_rewrite "qbit.internal"
              add_rewrite "homepage.internal"
              add_rewrite "ha.internal"
              add_rewrite "bazarr.internal"
              add_rewrite "adguard.internal"
          volumeMounts:
            - name: conf
              mountPath: /opt/adguardhome/conf
      containers:
        - name: adguardhome
          image: adguard/adguardhome:latest
          ports:
            - containerPort: 53
              protocol: TCP
            - containerPort: 53
              protocol: UDP
            - containerPort: 80
              name: web
            - containerPort: 3000
              name: setup
          volumeMounts:
            - name: conf
              mountPath: /opt/adguardhome/conf
            - name: work
              mountPath: /opt/adguardhome/work
      volumes:
        - name: conf
          hostPath:
            path: /home/obiwan/k8s_data/adguardhome/conf
            type: DirectoryOrCreate
        - name: work
          hostPath:
            path: /home/obiwan/k8s_data/adguardhome/work
            type: DirectoryOrCreate
