apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  - argocd-cmd-params.yaml
  - ingress.yaml
  - application.yaml
  - application-adguard.yaml

patches:
  - target:
      version: v1
      kind: Secret
      name: argocd-secret
      namespace: argocd
    patch: |-
      - op: replace
        path: /data/admin.password
        value: JDJhJDEwJHk2MHBJSW40N3JBNzk2RTdmNXdPemUyVnNuZlBtc3FqSUFuMTlqMm5rYTNVPVRuRzQ5TXZT
      - op: replace
        path: /data/admin.passwordMtime
        value: MjAyNi0wNS0yNFQwMDowNjowMFo=
