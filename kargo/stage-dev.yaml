apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo
  annotations:
    kargo.akuity.io/color: blue
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: worthly
      sources:
        direct: true
  promotionMechanisms:
    argoCDAppUpdates:
      - appName: worthly-dev
        appNamespace: argocd
        imageUpdates:
          - repoURL: registry.registry:5000/worthly
            fromObjectRef:
              kind: Warehouse
              name: worthly
