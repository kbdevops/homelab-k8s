apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  jellyfin-dashboard.json: |
    {
      "title": "Jellyfin Traffic",
      "uid": "jellyfin-traffic",
      "timezone": "browser",
      "panels": [
        {
          "title": "Who is hitting Jellyfin (Source IPs)",
          "type": "table",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": {"type": "loki", "uid": "loki-homelab"},
          "targets": [
            {
              "expr": "sum by (ip) (count_over_time({namespace=\"kube-system\"} |= \"jellyfin\" | pattern `<ip> - -` [5m]))",
              "legendFormat": "{{ip}}"
            }
          ]
        },
        {
          "title": "Response Codes",
          "type": "piechart",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "datasource": {"type": "loki", "uid": "loki-homelab"},
          "targets": [
            {
              "expr": "sum by (status) (count_over_time({namespace=\"kube-system\"} |= \"jellyfin\" | pattern `<ip> - - [<_>] \"<_> <_> <_>\" <status>` [5m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "title": "Request Rate",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 },
          "datasource": {"type": "loki", "uid": "loki-homelab"},
          "targets": [
            {
              "expr": "sum(rate({namespace=\"kube-system\"} |= \"jellyfin\" [5m]))",
              "legendFormat": "Requests/s"
            }
          ]
        },
        {
          "title": "Slow Requests (>1s)",
          "type": "logs",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "datasource": {"type": "loki", "uid": "loki-homelab"},
          "targets": [
            {
              "expr": "{namespace=\"kube-system\"} |= \"jellyfin\" | pattern `<ip> - - [<_>] \"<method> <path> <_>\" <status> <_> \"<_>\" \"<_>\" <_> \"<router>\" \"<upstream>\" <duration>` | duration > 1000ms",
              "legendFormat": ""
            }
          ]
        },
        {
          "title": "External vs Internal Traffic",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 24, "h": 8 },
          "datasource": {"type": "loki", "uid": "loki-homelab"},
          "targets": [
            {
              "expr": "sum(rate({namespace=\"kube-system\"} |= \"jellyfin\" !~ \"192.168\" [5m]))",
              "legendFormat": "External"
            },
            {
              "expr": "sum(rate({namespace=\"kube-system\"} |= \"jellyfin\" |~ \"192.168\" [5m]))",
              "legendFormat": "Internal"
            }
          ]
        }
      ],
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" }
    }
