apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    metrics:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
    logs:
      access:
        enabled: true
    service:
      spec:
        externalTrafficPolicy: Local
